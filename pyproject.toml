[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-launch"
version = "0.1.0"
description = "Draft platform-native release announcements (HN, Reddit, X, Mastodon, LinkedIn) from CHANGELOG + README (Python port of @p-vbordei/agent-launch)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Vlad Bordei", email = "bordeivlad@gmail.com" }]
requires-python = ">=3.10"
keywords = [
  "release-announcements", "show-hn", "reddit", "twitter", "mastodon",
  "linkedin", "open-source", "changelog", "release-notes", "cli",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/p-vbordei/agent-launch-py"
Reference = "https://github.com/p-vbordei/agent-launch"
Issues = "https://github.com/p-vbordei/agent-launch-py/issues"

[project.scripts]
agent-launch = "agent_launch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_launch"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/hn.md" = "agent_launch/_data/prompts/hn.md"
"prompts/reddit.md" = "agent_launch/_data/prompts/reddit.md"
"prompts/x.md" = "agent_launch/_data/prompts/x.md"
"prompts/mastodon.md" = "agent_launch/_data/prompts/mastodon.md"
"prompts/linkedin.md" = "agent_launch/_data/prompts/linkedin.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
